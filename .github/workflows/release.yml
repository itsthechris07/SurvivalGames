# Publishes a release when a version tag is pushed: GitHub,
# then Modrinth and Hangar (build.gradle.kts, tokens in the environment "release"). SpigotMC has no upload API.
#   1. set `version` in build.gradle.kts (e.g. 2.1.0) and commit
#   2. git tag v2.1.0 && git push origin v2.1.0
# The release notes are the commit subjects since the previous tag.
# Versions with a '-' (2.1.0-beta) become pre-releases on GitHub only.
name: Release

on:
  push:
    tags: [ "v*" ]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          # all commits and tags for the release notes
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v5

      - name: Check the version
        id: version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' build.gradle.kts)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::The tag $GITHUB_REF_NAME doesn't match the version $version in build.gradle.kts"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build (with tests)
        run: chmod +x gradlew && ./gradlew :build

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          previous=$(git describe --tags --abbrev=0 "$GITHUB_REF_NAME^" 2>/dev/null || true)
          git log --no-merges --format='- %s' ${previous:+"$previous..$GITHUB_REF_NAME"} > notes.md
          if [ -n "$previous" ]; then
            echo -e "\n**Full changelog:** https://github.com/$GITHUB_REPOSITORY/compare/$previous...$GITHUB_REF_NAME" >> notes.md
          fi
          flags=""
          case "$VERSION" in *-*) flags="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" "build/libs/SurvivalGames-$VERSION.jar" \
            --title "SurvivalGames $VERSION" --notes-file notes.md $flags

  publish:
    needs: release
    if: ${{ !contains(needs.release.outputs.version, '-') }}
    runs-on: ubuntu-latest
    # the tokens are only available to version tags (Settings → Environments → release)
    environment: release
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v5

      - name: Get the release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view "$GITHUB_REF_NAME" --json body --jq .body > notes.md

      # the build is reproducible: the same jar as in the GitHub release
      - name: Upload to Modrinth and Hangar
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          HANGAR_API_KEY: ${{ secrets.HANGAR_API_KEY }}
        run: chmod +x gradlew && ./gradlew :modrinth :publishPluginPublicationToHangar --continue -PreleaseNotes=notes.md
