# language of the messages: en (messages.yml) or de (messages_de.yml) - other languages: put a translated
# messages_<language>.yml into the plugin folder (missing texts are English); /sg reload after a change
language: en
# texts use MiniMessage (<red>, <bold>, <#ff8800>, <gradient:aqua:blue>, ... see https://docs.papermc.io/adventure/minimessage/format),
# old color codes (&c) still work - the same goes for messages.yml
# in front of all messages (leave it empty for none)
prefix: "<dark_gray>[<gold>SG<dark_gray>]"
# the date of /sg lastseen (https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/time/format/DateTimeFormatter.html)
date-format: "dd.MM.yyyy HH:mm"
# the sidebar of the players in a game (players, team, kills, countdowns, play time left)
scoreboard: true

# the statistics of the players per game type (games, wins, kills, deaths): /sg stats, /sg top and the placeholders
# %sg_stats_...% and %sg_top_...%
stats:
  enabled: true
  # file: plugins/SurvivalGames/stats.yml
  # mysql: a MySQL/MariaDB database - the servers of a network share the statistics this way (/sg reload after a change)
  # every value can refer to an environment variable, so the password doesn't have to be in this file:
  # password: "${SG_MYSQL_PASSWORD}" - best with a MySQL user of its own that only has rights on this database
  storage: file
  mysql:
    url: "jdbc:mysql://localhost:3306/minecraft"
    user: minecraft
    password: ""
    # the table is created if it doesn't exist
    table: sg_stats
  # the Elo rating of the players in the game types: winning against strong players brings more than against weak
  # ones (everybody starts with 1000, /sg top rating) - the change of a game is at most k-factor
  rating:
    enabled: true
    games: [ survival-games, uhc, duels ]
    k-factor: 32
  # achievements of the players (first win, 3 kills in a game, a win without armor, ...): /sg achievements - saved
  # with the statistics
  achievements:
    enabled: true
    # what a player gets for an achievement (also offline): money of an economy plugin (Vault) and commands of the
    # console ({player}, {uuid}, {achievement}) - for every achievement (all) or one (e.g. legend)
    money: 0
    commands:
      all: [ ]
  # seasons: /sg season end (admins) keeps the best players of the season (/sg season <number>), runs the rewards of
  # the best players of the ranking and sets the statistics of reset to 0 - in a network on one server only
  seasons:
    ranking: rating
    # the statistics that start at 0 again (games, wins, kills, deaths, rating)
    reset: [ rating ]
    # commands of the console per place ({player}, {uuid}, {place}, {season}, {value})
    rewards:
      1: [ ]
      2: [ ]
      3: [ ]

# standalone: the games run next to each other on this server (players join with /sg join or a [sg] sign)
# game: this server runs exactly one game (network.arena), the players come from the lobby server and go back there
#   after the game - players who can't play are turned away before they connect (except ops)
# lobby: the lobby server of the network: no games, /sg join and [sg] signs send the players to a free game server
# the proxy (Velocity/BungeeCord) has to forward the plugin messages of the channel BungeeCord (Velocity:
# bungee-plugin-message-channel = true)
network:
  mode: standalone
  # game servers: the server the players are sent to after the game (the name in the proxy config, empty: kick)
  lobby-server: lobby
  # game servers: the arena of the game of this server
  arena: ""
  # lobby server: the game servers (name in the proxy config + address the lobby pings for the state of the game)
  servers:
    - name: sg-1
      address: localhost:25566

teams:
  # players can create teams with /sg team create (otherwise only admins with /sg game <arena> team create)
  players-can-create: true

chat:
  # players only see the chat of their own game (players outside of games only see each other)
  separate-games: true
  # messages starting with this only go to the own team (empty: no team chat)
  team-prefix: "@"
  # the chat in a game shows the team of the player - runs after chat plugins like EasyPrefix (false: the chat
  # plugin formats the chat, team and spectator chat stay)
  format: true

# the settings of the game types - arenas override min-players, max-players, team-size and world-border.size
# (/sg arena <arena> players|teamsize|border)
survival-games:
  # the prefix of the messages of this game type, e.g. "<dark_gray>[<gold>SG<dark_gray>]" (empty: the prefix above)
  prefix: ""
  min-players: 2
  max-players: 24
  # players per team (1: everybody plays alone)
  team-size: 1
  # the lobby countdown starts once min-players are in the lobby (seconds)
  lobby-countdown: 60
  # the lobby countdown is shortened to this once the game is full
  full-countdown: 10
  # seconds the players stand frozen on their spawn points before the game begins
  start-countdown: 10
  # what happens to players who leave their spawn point before the start: freeze (they can't move) or explode (they
  # are out)
  start-platforms: freeze
  # explode: how often the players are warned (and put back onto their spawn point) before they blow up
  start-platform-warnings: 1
  # without spawn points the players spawn in a circle around the center (radius in blocks)
  spawn-circle-radius: 15
  # seconds without PvP after the start
  grace-period: 60
  # the chests are filled again every ... minutes (0: never)
  refill-minutes: 5
  # members of the same team can hurt each other
  friendly-fire: false
  # players who are out of the game watch the rest (otherwise they leave) - others can watch with /sg spectate
  spectators: true
  # monsters spawn in the arena
  monsters: false
  # the time of day (fixed, 6000: noon)
  time: 6000
  # players make progress in their advancements while they are in the game
  advancements: false
  # players can break and place every block (otherwise only the blocks below and the ones placed in the game)
  building: false
  breakable-blocks: [ cobweb, short_grass, tall_grass, fern, large_fern, dead_bush, oak_leaves, birch_leaves, spruce_leaves, jungle_leaves, acacia_leaves, dark_oak_leaves, cake, tnt ]
  placeable-blocks: [ cobweb, cake, tnt, fire, crafting_table ]
  world-border:
    # the size (blocks) of the world border around the center (0: none)
    size: 500
    # the border starts shrinking ... minutes after the start (0: only in the deathmatch) and is final-size blocks wide
    # after shrink-minutes - everybody is warned a minute before
    shrink-after: 8
    shrink-minutes: 7
    final-size: 150
    # damage per second for every block outside of the border (2 = one heart), starting ... blocks outside of it
    damage: 1.0
    buffer: 0
  deathmatch:
    # the deathmatch starts after ... minutes (0: never) or once only ... players are left (0: never)
    minutes: 20
    players: 3
    # seconds of warning before everybody is teleported back to the spawn points
    warning: 30
    # the world border around the center during the deathmatch shrinks from border-size to final-border-size in
    # border-minutes
    border-size: 75
    final-border-size: 15
    border-minutes: 3
  # lightnings (without damage) show where every player alive is - nobody can hide: every interval seconds after
  # ... minutes or once only ... players are left (0: never)
  reveal:
    minutes: 12
    players: 3
    interval: 60
  # the players vote for the map in the lobby: the arena of the game and other arenas of Survival Games nobody waits
  # in (same team size) - the votes are counted end-seconds before the start, then everybody moves into the arena that
  # has won (not on a game server of a network). Players with sg.vote.2 ... sg.vote.5 have more votes
  map-voting:
    enabled: true
    # the number of maps to choose from (the arena of the game is one of them)
    maps: 5
    # the map of the last round isn't offered again right away (if there are other maps)
    block-last: true
    end-seconds: 10
  # fireworks for the winners
  fireworks: true
  # seconds after the end until the next round (everybody leaves the arena)
  ending-seconds: 15

varo:
  # the prefix of the messages of this game type, e.g. "<dark_gray>[<green>Varo<dark_gray>]" (empty: the prefix above)
  prefix: ""
  min-players: 2
  max-players: 100
  team-size: 2
  # seconds from /sg game <arena> start until the game begins
  start-countdown: 60
  spawn-circle-radius: 30
  # minutes every player may play per day
  play-time: 15
  # the hour (0-23) a new day starts - the play time is reset then
  day-start-hour: 0
  # the times of the day the game can be played at (empty: always), e.g. [ "18:00-20:00" ] or for some days of the
  # week [ "mon-fri 18:00-20:00", "sat,sun 14:00-22:00" ] - outside of them nobody can join and everybody in the game
  # leaves it (server time, "22:00-02:00" ends on the next day)
  play-hours: [ ]
  # seconds without damage after joining (0: none)
  join-protection: 10
  # the play time doesn't run out while an enemy is this close (blocks, 0: always runs out) - you can't log out of a fight
  combat-radius: 20
  # a villager stands in for a player who leaves the server for ... seconds (0: none) - whoever kills it kills the
  # player, damage it takes stays when he comes back
  offline-npc-seconds: 60
  friendly-fire: false
  # players who are out of the game can watch (otherwise they can't join anymore)
  spectators: true
  # fireworks for the winners
  fireworks: true
  # players make progress in their advancements while they are in the game
  advancements: false
  # what happens at the 1st, 2nd, 3rd, ... strike of an admin (/sg game <arena> strike): coordinates (the position
  # of the player is announced), inventory (his inventory in the game is cleared), out (he is out of the game),
  # warning (nothing else) - strikes beyond the list are only warnings
  strikes: [ coordinates, inventory, out ]
  # no PvP during the first ... days of the game (0: PvP from the start)
  peaceful-days: 0
  # players who haven't played for ... days in a row are out of the game (0: never)
  inactive-days: 0
  # from day ... on the positions of all players alive are announced at the start of every day (0: never)
  coordinates-from-day: 0
  # the world and the game are saved as backups/<arena>/<day>.zip in the plugin folder when the game begins and
  # every day - the newest ... are kept (0: no backups)
  backups: 7
  world-border:
    # the size (blocks) of the world border when the game starts around the center (0: no border)
    size: 2000
    # blocks the border shrinks every day (within 10 minutes after the new day begins)
    shrink-per-day: 100
    # the border doesn't get smaller than this
    min-size: 200
    # damage per second for every block outside of the border (2 = one heart), starting ... blocks outside of it
    damage: 0.2
    buffer: 5

# a round in a newly generated world (/sg arena create <name> --type uhc): no loot, health doesn't come back by itself,
# the teams start at random places and the world border pushes everybody into the center
uhc:
  # the prefix of the messages of this game type, e.g. "<dark_gray>[<red>UHC<dark_gray>]" (empty: the prefix above)
  prefix: ""
  min-players: 2
  max-players: 40
  # players per team (1: everybody plays alone)
  team-size: 1
  # the lobby countdown starts once min-players are in the lobby (seconds)
  lobby-countdown: 60
  # the lobby countdown is shortened to this once the game is full
  full-countdown: 10
  # seconds the players stand frozen on their places before the game begins
  start-countdown: 10
  # seconds without PvP after the start
  grace-period: 600
  # members of the same team can hurt each other
  friendly-fire: false
  # players who are out of the game watch the rest (otherwise they leave) - others can watch with /sg spectate
  spectators: true
  monsters: true
  # the time of day (-1: day and night change, 6000: always noon)
  time: -1
  # players make progress in their advancements while they are in the game
  advancements: false
  # players can break and place every block
  building: true
  # health comes back by itself (otherwise only with golden apples, golden heads, potions and the final heal)
  natural-regeneration: false
  # a player who dies drops his head - 8 gold ingots around it make a golden head (heals longer than a golden apple)
  golden-heads: true
  # everybody alive gets full health and food ... minutes after the start (0: never)
  final-heal: 10
  # the hearts of every player in the tab list
  health-in-tab: true
  # the teams start at random places inside the world border, at least ... blocks apart (less if there is no room)
  scatter-distance: 100
  # the world inside the border is generated while players wait in the lobby (less lag in the game), not before
  # somebody joins (on a game server of a network right away)
  pregenerate: true
  # cutclean: ores and meat drop smelted, timber: the whole tree falls when a log is broken
  scenarios: [ cutclean, timber ]
  world-border:
    # the size (blocks) of the world border around the center (0: none) - with per-team the largest size
    size: 1000
    # the world grows with the players: min-size plus per-team blocks for every team (per-team 0: always size)
    per-team: 100
    min-size: 300
    # the border starts shrinking ... minutes after the start and is final-size blocks wide after shrink-minutes -
    # everybody is warned a minute before
    shrink-after: 20
    shrink-minutes: 20
    final-size: 100
    # damage per second for every block outside of the border (2 = one heart), starting ... blocks outside of it
    damage: 1.0
    buffer: 0
  deathmatch:
    # the deathmatch starts after ... minutes or once only ... players are left (0: never) - everybody is teleported
    # into a circle around the center
    minutes: 0
    players: 0
    warning: 30
    border-size: 100
    final-border-size: 20
    border-minutes: 5
  # lightnings (without damage) show where every player alive is: every interval seconds after ... minutes or once
  # only ... players are left (0: never)
  reveal:
    minutes: 0
    players: 0
    interval: 60
  # fireworks for the winners
  fireworks: true
  # seconds after the end until the next round (everybody leaves the arena)
  ending-seconds: 15

# two players (or two teams) with the same kit on a small map with 2 spawn points (/sg arena create <name> --type
# duels): /sg duel waits for an opponent, /sg duel <player> [kit] challenges somebody
duels:
  # the prefix of the messages of this game type, e.g. "<dark_gray>[<aqua>Duels<dark_gray>]" (empty: the prefix above)
  prefix: ""
  min-players: 2
  max-players: 2
  # players per team (2 with max-players 4: 2 vs 2)
  team-size: 1
  # the kit everybody gets (/sg kit create <name>) - a challenge can choose another one, empty: none
  kit: ""
  # seconds a challenge can be accepted
  invite-seconds: 60
  lobby-countdown: 5
  full-countdown: 5
  # seconds the players stand frozen on their spawn points before the duel begins
  start-countdown: 3
  grace-period: 0
  friendly-fire: false
  # players who are out watch the rest (otherwise they leave) - others can watch with /sg spectate
  spectators: true
  monsters: false
  # the time of day (fixed, 6000: noon)
  time: 6000
  advancements: false
  # players can break and place every block (otherwise only the blocks below and the ones placed in the game)
  building: false
  breakable-blocks: [ cobweb ]
  placeable-blocks: [ cobweb ]
  world-border:
    # the size (blocks) of the world border around the center (0: none)
    size: 0
  # fireworks for the winner
  fireworks: true
  # seconds after the end until the arena is free again (everybody leaves it)
  ending-seconds: 5

# games: the game types the module is used in (survival-games, varo, uhc, duels)
modules:
  inventory-view:
    # who was killed can look at the inventory, armor, health and effects of the killer (a clickable message), the
    # killer at those of the victim and at the end everybody at those of the winners
    enabled: true
    games: [ survival-games, varo, uhc, duels ]
  kits:
    # the players choose a kit in the lobby and get it when the game begins - admins save their inventory as kit
    # (/sg kit create <name> [--permission]), kits with a permission need sg.kit.<name>
    enabled: true
    games: [ survival-games ]
    # the kit of players who didn't choose one (empty: none)
    default: ""
  bounty:
    # players put money (economy plugin via Vault) on a player alive: /sg bounty <player> <amount> - whoever kills him
    # gets all of it, otherwise (he dies otherwise or wins, the round is stopped) it is paid back
    enabled: true
    games: [ survival-games, varo, uhc ]
    min: 10
    # the highest bounty a player can put on somebody at once (0: no limit)
    max: 0
  restrictions:
    # rules for items: banned items can't be crafted, picked up or used and are taken away, banned potions can't be
    # brewed or drunk (strength also bans strong_strength and long_strength), enchantments are lowered to their limit
    # (0: banned) - e.g. banned-items: [ totem_of_undying, end_crystal ], max-enchantments: { sharpness: 3 }
    enabled: true
    games: [ varo ]
    banned-items: [ ]
    banned-potions: [ ]
    max-enchantments: { }
  sponsor:
    # spectators (also players who are out) send items to the players alive and pay with the money of an economy
    # plugin (Vault): /sg sponsor - item like in /give, amount, price (0: free)
    enabled: true
    games: [ survival-games ]
    # seconds between two items of the same spectator
    cooldown: 30
    items:
      - { item: cooked_beef, amount: 4, price: 10 }
      - { item: arrow, amount: 16, price: 20 }
      - { item: golden_apple, price: 50 }
      - { item: "splash_potion[potion_contents={potion:\"healing\"}]", price: 40 }
      - { item: iron_chestplate, price: 80 }
      - { item: ender_pearl, price: 60 }
  backpack:
    # a crafted backpack (leather around a chest, a diamond at the bottom)
    enabled: true
    games: [ varo ]
    # team: the team shares one backpack, player: everybody has their own
    type: team
    # rows of the backpack (1-6)
    rows: 3
  chest-lock:
    # a sign with [Lock] in the first line on a chest (barrel, furnace, ...) locks it for the own team
    enabled: true
    games: [ varo ]
  gravity-grenade:
    # crafted from a snowball, TNT and an ender pearl: tears out the blocks where it lands and pulls them and the
    # players nearby into one point (radius in blocks, 1-8)
    enabled: true
    games: [ varo, survival-games ]
    radius: 6
  tracker:
    # a compass that points at the nearest enemy (holding it shows his name and distance) - Survival Games: everybody
    # alive gets one when the grace period is over, Varo: on the spawn point
    enabled: true
    games: [ survival-games ]
  supply-drop:
    # every ... minutes a chest with the supply loot of loot.yml lands at a random place near the center, announced
    # with its coordinates (not in the deathmatch)
    enabled: true
    games: [ survival-games ]
    minutes: 4
    # seconds between the announcement and the landing
    warning: 20
    # the greatest distance from the center (blocks, always inside the world border)
    radius: 100
  toxic-rain:
    # some rains hurt everybody under the open sky (never kills)
    enabled: true
    games: [ varo ]
    # chance (percent) that a rain is toxic
    chance: 30
    # damage every 2 seconds (2 = one heart)
    damage: 1.0
  cosmetics:
    # the players choose an effect for their kills, a trail for their arrows and an effect for their wins
    # (/sg cosmetics) - kept with the statistics (stats.enabled), so a MySQL database shares them in a network
    enabled: true
    games: [ survival-games, varo, uhc, duels ]
    # how a cosmetic is unlocked: free, a price (money of an economy plugin), achievement:<achievement> or permission
    # (only with the permission) - the permission sg.cosmetic.<name> (sg.cosmetic.* for all) always unlocks it
    unlock:
      blood: free
      hearts: 250
      firework: 500
      lightning: 1000
      souls: achievement:hunter
      explosion: achievement:unstoppable
      flames: free
      notes: 250
      magic: 500
      soul-flames: 750
      stars: achievement:rampage
      flame-ring: 500
      music: 750
      totem: achievement:first_win
      starfall: achievement:champion
  betting:
    # spectators (also players who are out) bet money (economy plugin via Vault) on the winner: /sg bet <player>
    # <amount> bets on his team. The odds come from the Elo ratings of the teams alive (minus the margin of the house)
    # and stay as they were when the bet was placed - bets on the winners pay amount * odds, a draw or a stopped round
    # pays everything back (also the bets of a Varo when the server restarts)
    enabled: false
    games: [ survival-games, uhc ]
    min: 10
    # the highest bet at once (0: no limit)
    max: 0
    # the share of the house (0.1: the odds are 10 % lower than fair ones) and the highest odds
    margin: 0.1
    max-odds: 20
    # no more bets once only ... teams are left
    close-at: 2
  alliances:
    # in games where everybody plays alone: /sg ally <player> offers an alliance, the same command of the other player
    # accepts it - allies can't hurt each other and the tracker ignores them. /sg ally leave betrays the allies, all
    # alliances break once only break-at players are left (0: never), in the deathmatch or when nobody else is left
    enabled: false
    games: [ survival-games, uhc ]
    # players per alliance
    max-size: 2
    break-at: 3
  force-field:
    # the world border throws back what hits it: projectiles (arrows, tridents, ender pearls, ...) bounce off, players
    # who run into it get a shock (damage, 2 = one heart) and are pushed back
    enabled: false
    games: [ survival-games ]
    damage: 2.0
  fallen:
    # a cannon shot everybody in the game hears for every player who is out, every ... minutes (0: never, Varo: when
    # a new day begins) a list of the players who have fallen since the last one
    enabled: false
    games: [ survival-games, varo, uhc ]
    cannon: true
    minutes: 5
  training-score:
    # when the players stand on their spawn points everybody gets a training score from 1 to 12: 6 for the start
    # rating, one more (less) for every points-per-score rating points above (below) and up to +-random by chance
    enabled: false
    games: [ survival-games, uhc ]
    points-per-score: 50
    random: 1
  reaping:
    # more players than max-players can wait in the lobby (applicants * max-players), when the game starts max-players
    # of them are drawn - the others watch. Everybody has one lot, plus missed-lots for every reaping he wasn't drawn
    # in (until he is) and n - 1 with the permission sg.reaping.lots.<n> (2-10)
    enabled: false
    games: [ survival-games ]
    applicants: 2.0
    missed-lots: 1
  quell:
    # every ... rounds of an arena (0: never) or by chance (percent) a round is a Quell with one of the rules - a
    # rule changes settings of survival-games for that round. Admins choose the rule: /sg game <arena> quell <rule>
    enabled: false
    games: [ survival-games ]
    every: 25
    chance: 0
    # name: the settings of survival-games it changes (the description is the message quell_rule_<name>, otherwise
    # the name)
    rules:
      no-grace: { grace-period: 0 }
      nowhere-to-hide: { reveal: { minutes: 1, interval: 30 } }
      sudden-border: { world-border: { shrink-after: 1, shrink-minutes: 5 } }
      no-refill: { refill-minutes: 0 }
  arena-events:
    # the Gamemakers strike: every min-minutes to max-minutes (after the grace period, not in the deathmatch) the arena
    # turns against the players for duration seconds, announced warning seconds before - poison-water: the water
    # poisons, swarm: swarm-size mobs (swarm-mob) attack every player, fog: nobody sees far, heat-wave: hungry and slow
    # under the open sky. Admins start one: /sg game <arena> event <event>
    enabled: false
    games: [ survival-games ]
    min-minutes: 3
    max-minutes: 6
    warning: 10
    duration: 30
    events: [ poison-water, swarm, fog, heat-wave ]
    swarm-mob: silverfish
    swarm-size: 3

# posts what happens in the games to a Discord channel: create a webhook in the settings of the channel
# (Integrations > Webhooks) and paste its URL - or keep it out of this file with an environment variable:
# webhook-url: "${SG_DISCORD_WEBHOOK}"
discord:
  enabled: false
  webhook-url: ""
  # start, win, elimination, varo-day, strike, achievement, season
  events: [ start, win, varo-day, strike, season ]
  # the game types that are posted (survival-games, varo, uhc, duels)
  games: [ survival-games, varo, uhc ]
  # the name and picture of the messages (empty: those of the webhook)
  username: ""
  avatar-url: ""

# money of an economy plugin for every game type (needs Vault or VaultUnlocked and an economy plugin, e.g.
# EssentialsX), 0 = nothing
rewards:
  enabled: false
  kill: 5
  # every player of the winning team (also offline in a Varo)
  win: 50
  # every player who took part, at the end of the game
  game: 10
  # commands of the console ({player}, {uuid}, {arena}, {type}), also without an economy plugin - "[10s] ..." runs
  # the command 10 seconds later, e.g. "give {player} diamond 1"
  commands:
    kill: []
    win: []
    game: []

# parties of the plugins Parties or Party and Friends (in a network: "Spigot Party API for Party and Friends" on the
# game servers; the proxy plugins take the members along when the leader is sent to a game server)
parties:
  enabled: true
  # the party leader takes the members of their party on this server into the lobby (/sg join, join signs and NPCs)
  join-together: true
  # parties play in the same team (with team-size > 1) - in the team a member chose, otherwise in a team with room
  # for all of them
  same-team: true

# join NPCs of Citizens or FancyNpcs (/sg npc link <arena>)
npcs:
  # linked NPCs show the state of the game (Citizens: an extra hologram line, FancyNpcs: behind the display name)
  show-status: true

# the games are recorded and can be watched again (/sg replay): the players, their items, the blocks they change and
# the messages of the game - in a copy of the map, with pause, speed and jumps (permission sg.replay)
replays:
  enabled: true
  # the game types that are recorded - a Varo gets one recording per day and is played in the backup of the world from
  # the beginning of that day (varo.backups, they have to be kept at least as long as the recordings); while a Varo
  # is running only admins (sg.admin) can watch its recordings
  games:
    - survival-games
    - varo
    - uhc
    - duels
  # the newest recordings that are kept per arena (plugins/SurvivalGames/replays), 0: all of them
  keep: 10
  # the replays that can be watched at the same time - every one has its own world
  max-playbacks: 2

# checks GitHub for new versions of SurvivalGames (at the start and every 6 hours) and tells the console and the
# admins (sg.admin) every time they join - only the list of releases is requested, nothing is sent about the server
# (the anonymous statistics of bStats are disabled in plugins/bStats/config.yml)
update-checker:
  enabled: true

# anonymous error reports to Sentry, so bugs of SurvivalGames get fixed: only errors in the code of SurvivalGames,
# without player names, uuids or the address of the server - set to false to send nothing
# (the anonymous statistics of bStats are disabled in plugins/bStats/config.yml)
sentry:
  enabled: true
  # attaches the settings of this file that differ from the defaults, so the error can be reproduced with the same
  # settings; passwords, webhooks, database and server addresses, uuids and player names are removed first
  include-config: true
  # reports where the plugin blocks the server thread for this many milliseconds (lag spikes, freezes), 0: off
  lag-threshold: 1000

# writes AGENTS.md and CLAUDE.md into this folder: notes for AI assistants (Claude Code, Codex, Cursor, ...) that help
# to configure the plugin - which files they may change, that they mustn't invent options, ... (the plugin itself
# doesn't use any AI). false: the files are not written (delete them yourself)
agent-files: true
