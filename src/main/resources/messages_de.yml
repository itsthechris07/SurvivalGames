# Texte nutzen MiniMessage: <red>, <bold>, <#ff8800>, <gradient:aqua:blue>, ... (https://docs.papermc.io/adventure/minimessage/format)
# alte Farbcodes (&c) funktionieren weiterhin. {0}, {1}, ... werden ersetzt (Namen, Zahlen, ...); \< für ein echtes <
# klickbare Befehle: <run:"/sg leave">...</run> führt den Befehl aus, <suggest:"/sg team create ">...</suggest> schreibt ihn in den Chat
# mehrere Zeilen von Item-Texten (Lore) werden mit \n getrennt

