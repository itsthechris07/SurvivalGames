# Texts use MiniMessage: <red>, <bold>, <#ff8800>, <gradient:aqua:blue>, ... (https://docs.papermc.io/adventure/minimessage/format)
# old color codes (&c) still work. {0}, {1}, ... are replaced (names, numbers, ...); write \< for a literal <
# clickable commands: <run:"/sg leave">...</run> runs the command, <suggest:"/sg team create ">...</suggest> puts it into the chat
# several lines of item texts (lore) are separated by \n

