# ---------------------------------------------------------------- command descriptions
command_version: 'shows the plugin version'
command_help: 'shows all commands'
command_join: 'joins a game (an arena or a server, without: the fullest free game)'
command_spectate: 'watches a running game (spectators: choose a player to watch)'
command_leave: 'leaves your game'
command_list: 'lists all games'
command_info: 'shows the state and the rules of a game'
command_time: 'shows how long you can still play today (Varo)'
command_ping: 'shows the ping of a player'
command_lastseen: 'shows when a player was online the last time'
command_stats: 'shows the statistics of a player (games, wins, kills, deaths)'
command_top: 'shows the best players (wins, kills, deaths or games - of one game type or all)'
command_achievements: 'shows your achievements (with a player: his)'
command_strikes: 'shows your strikes (Varo)'
command_start: 'starts your game right away (--force: also with fewer players)'
command_build: 'turns the build mode on or off'
command_reload: 'reloads config.yml, loot.yml and the messages'
command_debug: 'shows debug information'
command_team: 'opens the team menu'
command_team_list: 'lists all teams of your game and their players'
command_team_create: 'creates a team and joins it'
command_team_join: 'joins a team'
command_team_leave: 'leaves your team'
command_arena_create: 'creates an arena (--type, --map, --world: import a world, --generate, --seed)'
command_arena_list: 'lists all arenas'
command_arena_info: 'shows the setup of an arena'
command_arena_edit: 'teleports you into a copy of the map to set it up'
command_arena_save: 'saves the map you edit and teleports you back'
command_arena_lobby: 'sets the lobby to your position'
command_arena_lobby_remove: 'removes the lobby of the arena (the players wait in the lobby world)'
command_lobby_setworld: 'sets the lobby world of all arenas (a map of maps/ or a world of the server, which is imported)'
command_lobby_edit: 'teleports you into a copy of the lobby world'
command_lobby_setspawn: 'sets the spawn of the lobby world to your position'
command_lobby_save: 'saves the lobby world you edit and teleports you back'
command_lobby_remove: 'removes the lobby world (the map stays in maps/)'
command_arena_center: 'sets the center (world border, spawn circle) to your position'
command_arena_spawn_add: 'adds a spawn point at your position'
command_arena_spawn_list: 'lists the spawn points'
command_arena_spawn_remove: 'removes a spawn point'
command_arena_spawn_tp: 'teleports you to a spawn point'
command_arena_spawn_clear: 'deletes all spawn points'
command_arena_players: 'sets the minimum and maximum number of players'
command_arena_teamsize: 'sets the number of players per team'
command_arena_border: 'sets the size of the world border (0: none)'
command_arena_type: 'sets the game type (survival-games, varo)'
command_arena_displayname: 'sets the name shown to the players (reset: the name of the arena)'
command_arena_creategame: 'creates the game of the arena, also after a restart'
command_arena_removegame: 'stops the game of the arena and creates no new one'
command_arena_delete: 'deletes the arena (the map stays)'
command_game_start: 'starts the game right away (--force: also with fewer players)'
command_game_stop: 'stops the game (Varo is saved)'
command_game_create: 'creates the game of the arena once'
command_game_reset: 'starts Varo again from the lobby (--teams: deletes the teams too)'
command_game_revive: 'brings a player who is out back into the game'
command_game_deathmatch: 'starts the deathmatch right away'
command_game_strike: 'gives a player a strike (Varo, varo.strikes in config.yml)'
command_game_unstrike: 'removes the last strike of a player'
command_game_strikes: 'lists the strikes of all players or of one'
command_game_backup: 'makes a backup of the world and the state of the Varo right now'
command_game_backups: 'lists the backups of the Varo'
command_game_restore: 'replaces the world and the state of the Varo with a backup'
command_game_teams: 'lists the teams of the game'
command_game_team_create: 'creates a team'
command_game_team_add: 'puts a player into a team'
command_game_team_remove: 'takes a player out of the team'
command_game_team_delete: 'deletes a team'
command_npc_link: 'links the NPC (Citizens, FancyNpcs) you click next with an arena (lobby server: a game server)'
command_npc_unlink: 'removes the link of the NPC you click next'
command_npc_list: 'lists the join NPCs'
command_inventory: 'shows the inventory of a message after a kill or a game'
command_bounty: 'puts a bounty on a player (without a player: all bounties)'
command_sponsor: 'spectators send items to players alive (without a player: the menu)'
command_settings: 'changes the settings of Survival Games and Varo (without a value: the menu)'
command_vote: 'votes for the map in the lobby (without a map: the menu)'
command_kit: 'chooses a kit (without a name: the menu)'
command_kit_create: 'saves your inventory as kit, the item in your hand is its icon (--permission: only with sg.kit.name)'
command_kit_delete: 'deletes a kit'
command_kit_edit: 'puts a kit into your empty inventory to change it'
command_kit_list: 'lists the kits'
command_leaderboard_create: 'creates a hologram with the best players of a statistic at your position'
command_leaderboard_remove: 'removes the nearest leaderboard hologram'
command_leaderboard_list: 'lists the leaderboards'
command_replay: 'shows the replays (while watching one: its controls)'
command_replay_list: 'lists the replays (of an arena)'
command_replay_play: 'watches a replay'
command_replay_pause: 'pauses the replay or continues it'
command_replay_speed: 'sets the speed of the replay (0.25 to 8)'
command_replay_skip: 'jumps seconds forward in the replay (back: -10)'
command_replay_goto: 'jumps to a time of the replay (90 or 1:30)'
command_replay_players: 'shows the players of the replay'
command_replay_follow: 'watches the replay through the eyes of a player'
command_replay_leave: 'leaves the replay'
command_replay_delete: 'deletes a replay'
